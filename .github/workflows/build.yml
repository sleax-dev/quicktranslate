name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  LINUX_DEPS: libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - uses: actions/setup-node@v7
        with: { node-version: lts/* }
      - uses: dtolnay/rust-toolchain@v1
        with: { toolchain: stable, components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm install
      - run: npm run build # type-check and bundle the UI
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy --locked -- -D warnings
        working-directory: src-tauri
      - run: cargo test --locked
        working-directory: src-tauri
      - run: npx tauri build --no-bundle # compile and link the release binary

  # One tag (v1.3.0) publishes a separate release per platform: v1.3.0-windows, v1.3.0-macos, v1.3.0-linux.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            name: Windows
            args: --bundles nsis
            body: |
              ## QuickTranslate for Windows

              **Windows 10 / 11, 64-bit.** Download `QuickTranslate_<version>_x64-setup.exe` and run it.

              - Installs for the current user, no admin rights needed. Settings from earlier versions are kept.
              - Needs the [WebView2 Runtime](https://developer.microsoft.com/microsoft-edge/webview2/), which Windows 10/11 already have.
              - The installer is not code-signed, so SmartScreen may warn on first run: **More info → Run anyway**.

              Default hotkey: `Ctrl+Shift+T`. Looking for macOS or Linux? See the other releases of this version.
          - os: macos-latest
            platform: macos
            name: macOS
            args: --target universal-apple-darwin --bundles app,dmg
            body: |
              ## QuickTranslate for macOS

              **macOS 10.15 Catalina or later, Universal (Apple Silicon M1–M4 and Intel).** Download `QuickTranslate_<version>_universal.dmg`, open it and drag QuickTranslate into Applications.

              **First launch.** The app is not notarized by Apple, so macOS blocks it the first time:
              open it once, then go to **System Settings → Privacy & Security → Open Anyway**.
              Or run this once in Terminal: `xattr -cr /Applications/QuickTranslate.app`

              **Accessibility permission.** QuickTranslate copies and pastes the selected text for you, which macOS only allows with permission:
              **System Settings → Privacy & Security → Accessibility → turn on QuickTranslate**. Restart the app after granting it.

              - Lives in the menu bar; the Dock icon brings the window back.
              - Default hotkey: `⌃⇧T` (Control+Shift+T). Any combination with ⌘, ⌃ or ⌥ can be set in Settings.

              Looking for Windows or Linux? See the other releases of this version.
          - os: ubuntu-22.04
            platform: linux
            name: Linux
            args: --bundles deb,rpm,appimage
            body: |
              ## QuickTranslate for Linux

              **64-bit (x86_64).** Pick the package for your distribution:

              | Package | For | Install |
              |---|---|---|
              | `.deb` | Ubuntu 22.04+, Debian 12+, Mint, Pop!_OS | `sudo apt install ./QuickTranslate_<version>_amd64.deb` |
              | `.rpm` | Fedora, openSUSE, RHEL | `sudo dnf install ./QuickTranslate-<version>-1.x86_64.rpm` |
              | `.AppImage` | Any distribution | `chmod +x QuickTranslate_*.AppImage && ./QuickTranslate_*.AppImage` |

              - **X11 session needed for the hotkey.** Wayland does not let apps register global hotkeys or send keystrokes; choose "Ubuntu on Xorg" / "Plasma (X11)" at the login screen. The translate window works on Wayland too.
              - The tray icon needs a system tray: built into KDE, Cinnamon and Xfce; on GNOME install the *AppIndicator* extension (preinstalled on Ubuntu).

              Default hotkey: `Ctrl+Shift+T`. Looking for Windows or macOS? See the other releases of this version.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - uses: actions/setup-node@v7
        with: { node-version: lts/* }
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm install
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}-${{ matrix.platform }}
          releaseName: QuickTranslate ${{ github.ref_name }} for ${{ matrix.name }}
          releaseBody: ${{ matrix.body }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
