name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  LINUX_DEPS: libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - uses: actions/setup-node@v7
        with: { node-version: lts/* }
      - uses: dtolnay/rust-toolchain@v1
        with: { toolchain: stable, components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm install
      - run: npm run build # type-check and bundle the UI
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy --locked -- -D warnings
        working-directory: src-tauri
      - run: cargo test --locked
        working-directory: src-tauri
      - run: npx tauri build --no-bundle # compile and link the release binary

  # One tag (v1.3.0) publishes one release holding the Windows, macOS and Linux installers.
  # The release is created first so the three build jobs upload into it instead of racing to create it.
  create-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          sed "s/<version>/${GITHUB_REF_NAME#v}/g" .github/release-notes.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "QuickTranslate $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            args: --bundles nsis
          - os: macos-latest
            platform: macos
            args: --target universal-apple-darwin --bundles app,dmg
          - os: ubuntu-22.04
            platform: linux
            args: --bundles deb,rpm,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - uses: actions/setup-node@v7
        with: { node-version: lts/* }
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm install
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the installers for the in-app updater (.sig files). The public key is in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }} # existing release, created above; tauri-action uploads into it
          args: ${{ matrix.args }}
          uploadUpdaterJson: false # written once below; three jobs editing one latest.json would race

  # latest.json tells the app's updater the newest version and where each platform's signed installer is.
  updater-json:
    needs: release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - run: |
          gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" -p '*.sig' -D sigs
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          platforms='{}'
          for sig in sigs/*.sig; do
            file=$(basename "$sig" .sig)
            case "$file" in
              *-setup.exe)   keys="windows-x86_64 windows-x86_64-nsis" ;;
              *.app.tar.gz)  keys="darwin-x86_64 darwin-aarch64 darwin-x86_64-app darwin-aarch64-app" ;;
              *.AppImage)    keys="linux-x86_64 linux-x86_64-appimage" ;;
              *.deb)         keys="linux-x86_64-deb" ;;
              *.rpm)         keys="linux-x86_64-rpm" ;;
              *) continue ;;
            esac
            for key in $keys; do
              platforms=$(jq --arg k "$key" --rawfile s "$sig" --arg u "$base/$file" '.[$k] = {signature: $s, url: $u}' <<<"$platforms")
            done
          done
          jq -n --arg v "${GITHUB_REF_NAME#v}" --arg d "$(date -u +%FT%TZ)" --arg n "https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME" \
            --argjson p "$platforms" '{version: $v, notes: $n, pub_date: $d, platforms: $p}' > latest.json
          cat latest.json
          gh release upload "$GITHUB_REF_NAME" latest.json -R "$GITHUB_REPOSITORY" --clobber
